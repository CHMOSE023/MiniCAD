name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Windows / D3D11 ────────────────────────────────────────────────────────
  windows:
    name: Windows (D3D11)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B out/win -G "Visual Studio 17 2022"

      - name: Build
        run: cmake --build out/win --config Release

  # ── WebAssembly / WebGL2 ───────────────────────────────────────────────────
  wasm:
    name: WebAssembly (WebGL2)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: .emsdk-cache

      - name: Configure
        run: emcmake cmake -S . -B out/web -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build out/web --target MiniCADWeb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniCADWeb
          path: out/web/MiniCADWeb/
          retention-days: 7
