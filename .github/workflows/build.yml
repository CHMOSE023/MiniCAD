# MiniCAD 持续集成与发布
#   - 推送到 main、向 main 提交 PR：编译桌面版与网页版，运行单元测试
#   - 推送 v* 标签（例如 v0.1.0）：另外把两个版本打包成 zip，创建 GitHub Release 并上传；
#     发布说明取自 docs/release-notes/<标签>.md（没有该文件时只写一行默认说明）
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: "5.0.7"      # 与本地 build_wasm.bat 验证过的版本一致
  # 打包文件名里的版本：标签构建用标签名，其余用 dev
  PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  # ── 桌面版：Windows / D3D11 ────────────────────────────────────────────────
  windows:
    name: Windows (D3D11)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # USE_WIN32=ON：窗口程序，启动时不带控制台（与 release 预设相同）
      - name: Configure
        run: cmake -S . -B out/ci -DUSE_WIN32=ON

      - name: Build
        run: cmake --build out/ci --config Release --parallel

      # MiniGUIGolden（截图对比）依赖 GPU 与本机字体，CI 上不运行
      - name: Test
        run: ctest --test-dir out/ci -C Release --output-on-failure -E MiniGUIGolden

      # 输出目录里已有 MiniCADWin.exe 与构建后复制的 assets（字体、图标、填充图案、界面描述文件）
      - name: Package
        shell: pwsh
        run: |
          $name = "MiniCAD-$env:PACKAGE_VERSION-windows-x64"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse out/ci/MiniCADWin "dist/$name"
          Get-ChildItem "dist/$name" -Recurse -Include *.pdb,*.ilk,*.exp,*.lib | Remove-Item
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniCAD-Windows
          path: dist/*.zip
          retention-days: 7

  # ── 网页版：WebAssembly / WebGL2 ───────────────────────────────────────────
  web:
    name: Web (WebAssembly)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: .emsdk-cache

      - name: Configure
        run: emcmake cmake -S . -B out/web -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build out/web --target MiniCADWeb

      # index.html / .js / .wasm / .data 放到任意静态网站即可运行
      - name: Package
        run: |
          name="MiniCAD-$PACKAGE_VERSION-web"
          mkdir -p "dist/$name"
          cp out/web/MiniCADWeb/index.* "dist/$name/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          (cd dist && zip -r "$name.zip" "$name")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniCAD-Web
          path: dist/*.zip
          retention-days: 7

  # ── 发布：推送 v* 标签时创建 GitHub Release ────────────────────────────────
  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else echo "MiniCAD ${GITHUB_REF_NAME}" > release-notes.md; fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: MiniCAD ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*.zip
