name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Windows / D3D11 ────────────────────────────────────────────────────────
  windows:
    name: Windows (D3D11)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B out/ci

      - name: Build
        run: cmake --build out/ci --config Release

      # 截图对比测试依赖 GPU 与本机字体，CI 上不运行
      - name: Test
        run: ctest --test-dir out/ci -C Release --output-on-failure -E MiniGUIGolden

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniCAD-Windows
          path: out/ci/MiniCADWin/
          retention-days: 7

  # ── WebAssembly ────────────────────────────────────────────────────────────
  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: .emsdk-cache

      - name: Configure
        run: emcmake cmake -S . -B out/web -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build out/web --target WASM

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniCAD-Web
          path: out/web/Wasm/
          retention-days: 7
